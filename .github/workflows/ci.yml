name: IRMS CI
on:
  workflow_dispatch:
  push:
    branches: [main, feature/complete-irms-modules, hardening/complete-irms-security]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
